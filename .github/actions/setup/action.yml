name: Setup
description: Install pnpm (version from package.json), Node (version from .nvmrc) and dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0

    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
